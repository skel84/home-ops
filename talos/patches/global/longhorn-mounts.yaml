# Patches for Longhorn kubelet extraMounts
machine:
  kubelet:
    extraMounts:
      - destination: /var/lib/longhorn
        type: bind
        source: /var/lib/longhorn
        options:
          - bind
          - rshared
          - rw
  sysctls:
    # Hugepages are only used by the Longhorn v2 data engine, which is disabled.
    vm.nr_hugepages: "0"
  kernel:
    modules:
      - name: nvme_tcp
      - name: vfio_pci
      # - name: uio_pci_generic
