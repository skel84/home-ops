---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tekton-results
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: kubernetes
  sources:
    - repoURL: "https://github.com/skel84/home-ops.git"
      path: kubernetes/apps/tekton-results/tekton-results
      targetRevision: main
  destination:
    name: in-cluster
    namespace: tekton-pipelines
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
