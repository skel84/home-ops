---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-hello-dev
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    # Lets the Kargo Stage demo-dev sync this Application during promotion.
    kargo.akuity.io/authorized-stage: demo-delivery:demo-dev
spec:
  project: kubernetes
  # Kargo commits the promoted image digest under deploy/stages/demo-dev.
  source:
    repoURL: https://forgejo.rbl.lol/demo/delivery-demo.git
    path: deploy/stages/demo-dev
    targetRevision: main
  # One cluster, one namespace: the Rollout's destination stays unambiguous.
  destination:
    name: in-cluster
    namespace: demo-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The namespace and its Harbor pull Secret come from the demo-stages app.
      - ServerSideApply=true
