---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-ci
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: kubernetes
  source:
    repoURL: "https://github.com/skel84/home-ops.git"
    path: kubernetes/apps/demo/demo-ci
    targetRevision: main
  destination:
    name: in-cluster
    namespace: demo-ci
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
