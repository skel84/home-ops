---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: kubernetes
  sources:
    - repoURL: "https://github.com/skel84/home-ops.git"
      path: kubernetes/apps/keda/keda
      targetRevision: main
      ref: repo
    - repoURL: https://kedacore.github.io/charts
      chart: keda
      targetRevision: 2.18.3
      helm:
        releaseName: keda
        valueFiles:
          - $repo/kubernetes/apps/keda/keda/values.yaml
  destination:
    name: in-cluster
    namespace: keda
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
