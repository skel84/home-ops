---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apk-forge
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: kubernetes
  sources:
    - repoURL: "https://github.com/skel84/home-ops.git"
      path: kubernetes/apps/apk-forge/apk-forge
      targetRevision: main
  destination:
    name: in-cluster
    namespace: apk-forge
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
