---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubevirt-manager
  namespace: kubevirt-manager
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: network
      sectionName: https
  hostnames:
    - kubevirt-manager.rbl.lol
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: kubevirt-manager
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
