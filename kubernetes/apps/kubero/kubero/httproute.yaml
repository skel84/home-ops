---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubero
  namespace: kubero
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: network
      sectionName: https
  hostnames:
    - kubero.rbl.lol
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: kubero
          port: 2000
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
