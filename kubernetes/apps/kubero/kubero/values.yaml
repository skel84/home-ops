image:
  # renovate: datasource=docker depName=ghcr.io/kubero-dev/kubero/kubero
  tag: v3.1.1
  pullPolicy: IfNotPresent

# The UI is served by the internal Gateway (httproute.yaml). className is
# still passed to Kubero as the class for the Ingresses it creates for apps.
ingress:
  enabled: false
  className: internal

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

kubero:
  webhook_url: https://kubero.rbl.lol/api/repo/webhooks
  database:
    storageClassName: longhorn
  config:
    clusterissuer: letsencrypt-production
    kubero:
      console:
        enabled: false
