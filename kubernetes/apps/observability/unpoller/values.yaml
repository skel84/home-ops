controllers:
  unpoller:
    containers:
      app:
        image:
          repository: ghcr.io/unpoller/unpoller
          tag: v5.9.4@sha256:bf2ef9706159c60f81a631030fb792e5ab809d872791ee5d0029a023212b48a7
        env:
          TZ: Europe/Rome
          UP_UNIFI_DEFAULT_ROLE: home-ops
          UP_UNIFI_DEFAULT_URL: https://192.168.0.1
          UP_PROMETHEUS_HTTP_LISTEN: 0.0.0.0:80
          UP_INFLUXDB_DISABLE: true
        envFrom:
          - secretRef:
              name: unpoller-secret
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: &port 80
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness: *probes
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 10m
          limits:
            memory: 128Mi
defaultPodOptions:
  automountServiceAccountToken: true
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
service:
  app:
    controller: unpoller
    ports:
      http-metrics:
        port: *port
serviceMonitor:
  app:
    serviceName: unpoller
    endpoints:
      - port: http-metrics
        interval: 2m # Unifi API only polls at 2m intervals
        scrapeTimeout: 10s
# Keep app-template v4 ServiceAccount behaviour (namespace default SA, token mounted)
global:
  createDefaultServiceAccount: false
