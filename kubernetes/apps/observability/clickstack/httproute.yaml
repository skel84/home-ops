---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: clickstack
  namespace: observability
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: network
      sectionName: https
  hostnames:
    - hyperdx.rbl.lol
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: clickstack-app
          port: 3000
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
