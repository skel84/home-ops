---
apiVersion: batch/v1
kind: Job
metadata:
  name: coroot-cache-journal
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      # Share the Coroot pod's node so its RWO claim needs no second attachment.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/part-of: coroot
                  app.kubernetes.io/component: coroot
              topologyKey: kubernetes.io/hostname
      containers:
        - name: cache-journal
          image: ghcr.io/coroot/coroot:1.27.0
          command:
            - /usr/bin/python3
            - -u
            - -c
            - |
              import pathlib
              import sqlite3
              import time

              cache = pathlib.Path('/data/cache/db.sqlite')
              for attempt in range(30):
                  if not cache.exists():
                      time.sleep(2)
                      continue
                  try:
                      with sqlite3.connect(str(cache), timeout=5) as db:
                          mode = db.execute('PRAGMA journal_mode=WAL').fetchone()[0]
                      if mode != 'wal':
                          raise RuntimeError(f'Unexpected cache journal mode: {mode}')
                      print('Coroot metric cache uses WAL journaling.')
                      break
                  except sqlite3.OperationalError as error:
                      if 'locked' not in str(error):
                          raise
                      time.sleep(2)
              else:
                  raise RuntimeError('Coroot metric cache was not ready for WAL journaling')
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-coroot-coroot-0
