---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coroot
  namespace: coroot
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: network
      sectionName: https
  hostnames:
    - coroot.rbl.lol
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: coroot-coroot
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
