deploymentMode: Monolithic
loki:
  auth_enabled: false
  analytics:
    reporting_enabled: false
  server:
    log_level: info
  commonConfig:
    replication_factor: 1
  # single replica: the memberlist Service has no ready peer while the pod
  # starts, so a failed join must not abort startup (the 6.x default)
  extraMemberlistConfig:
    abort_if_cluster_join_fails: false
  compactor:
    working_directory: /var/loki/compactor/retention
    delete_request_store: filesystem
    retention_enabled: true
  ingester:
    chunk_encoding: snappy
  limits_config:
    retention_period: 7d
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01" # quote
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  structuredConfig:
    ruler:
      enable_api: true
      enable_alertmanager_v2: true
      alertmanager_url: "http://alertmanager-operated.observability.\
        svc.cluster.local:9093"
      storage:
        type: local
        local:
          directory: /rules
      rule_path: /rules/fake
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: asustor-iscsi
    size: 50Gi
    # chart default deletes the PVC (and its NAS LUN) on scale-down or StatefulSet delete
    # the community chart only renders the retention policy when this is true
    enableStatefulSetAutoDeletePVC: true
    whenScaled: Retain
    whenDeleted: Retain
gateway:
  replicas: 0
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
sidecar:
  image:
    registry: ghcr.io
    repository: home-operations/k8s-sidecar
    # 2.x serves the /healthz probes the chart now configures
    tag: 2.14.3@sha256:cc81b13164b15474260b8721bb6a63da2212a704fb92b5496091aabae3038487
  rules:
    searchNamespace: ALL
