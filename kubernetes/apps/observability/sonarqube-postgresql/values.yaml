# docker.io/bitnami no longer has versioned tags; the frozen copies live in
# bitnamilegacy and get no further updates.
image:
  repository: bitnamilegacy/postgresql
auth:
  enablePostgresUser: true
  username: sonar
  database: sonarqube
  existingSecret: sonarqube-postgresql-secret
architecture: standalone
primary:
  persistence:
    enabled: true
    storageClass: longhorn
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi
