---
persistence:
  enabled: true
  size: 20Gi
  storageClass: longhorn

gitea:
  admin:
    existingSecret: forgejo-admin-secret
    email: forgejo@rbl.lol
    passwordMode: initialOnlyRequireReset
  config:
    # Set explicitly: the chart only derives these from an enabled Ingress.
    server:
      DOMAIN: forgejo.rbl.lol
      ROOT_URL: https://forgejo.rbl.lol
      SSH_DOMAIN: forgejo.rbl.lol
    webhook:
      ALLOWED_HOST_LIST: external,pac.rbl.lol
    service:
      DISABLE_REGISTRATION: true
      REQUIRE_SIGNIN_VIEW: true
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: observability

# Served by the external Gateway (network/gateway/external-routes.yaml).
ingress:
  enabled: false

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi
