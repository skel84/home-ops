---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: livekit
  namespace: livekit
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: network
      sectionName: https
  hostnames:
    - livekit.rbl.lol
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: livekit
          port: 7880
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
