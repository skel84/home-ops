---
# Temporary: tests both Gateways against Home Assistant before the real move.
# Cilium's Envoy honours externalTrafficPolicy: Local on the app's LoadBalancer
# Service, so the route needs a plain ClusterIP Service.
apiVersion: v1
kind: Service
metadata:
  name: hass-gw-test
  namespace: home-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/controller: home-assistant
    app.kubernetes.io/instance: home-assistant
    app.kubernetes.io/name: home-assistant
  ports:
    - name: http
      port: 8123
      targetPort: 8123
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hass-gw
  namespace: home-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: network
      sectionName: https
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
      namespace: network
      sectionName: https
  hostnames:
    - hass-gw.rbl.lol
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: hass-gw-test
          port: 8123
          weight: 1
