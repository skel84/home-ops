---
# Temporary: tests both Gateways against Home Assistant before the real move.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hass-gw
  namespace: home-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: network
      sectionName: https
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
      namespace: network
      sectionName: https
  hostnames:
    - hass-gw.rbl.lol
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: home-assistant
          port: 8123
          weight: 1
