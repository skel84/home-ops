---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Cilium 1.20 needs Gateway API v1.6.1+; bump together with Cilium.
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.3/standard-install.yaml
  - ./gateways.yaml
  - ./https-redirect.yaml
  - ./livekit-route.yaml
  - ./external-routes.yaml
patches:
  # Deleting these CRDs would delete every route in the cluster.
  - target:
      kind: CustomResourceDefinition
    patch: |
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-options
        value: Prune=false
