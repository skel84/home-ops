      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pipelines-as-code
  namespace: pipelines-as-code
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: external
    namespace: network
    sectionName: https
  hostnames:
  - pac.rbl.lol
  rules:
  - backendRefs:
    - group: ''
      kind: Service
      name: pipelines-as-code-controller
      port: 8080
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
---
# demo's NetworkPolicy (from flights/webstack) only admits ingress-nginx pods;
# Gateway traffic arrives from Cilium's reserved ingress identity.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: demo-allow-gateway
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/managed-by: yokecd
      app.kubernetes.io/name: demo
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
