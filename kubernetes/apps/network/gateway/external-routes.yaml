# Routes for the public hosts, reached through the WAN port forward to this Gateway.
---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant-gateway
  namespace: home-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: home-assistant-proxy
  ports:
  - name: http
    port: 8123
    targetPort: 8123
    protocol: TCP
---
# Cilium's Envoy can't reach a hostNetwork backend on its own node, so
# hass.rbl.lol breaks whenever Home Assistant and the Gateway IP share a node.
# This plain TCP forwarder runs on the pod network, which reaches HA from any
# node; websockets and X-Forwarded-For pass through untouched.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant-proxy
  namespace: home-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: home-assistant-proxy
      containers:
      - name: socat
        image: docker.io/alpine/socat:1.8.1.1@sha256:7f9a06753033f2b7de18edc2353f2c15153413d95a039163c6db270fc7a6c3b0
        args:
        - TCP-LISTEN:8123,fork,reuseaddr
        - TCP:home-assistant.home-system.svc.cluster.local:8123
        ports:
        - name: http
          containerPort: 8123
        readinessProbe:
          tcpSocket:
            port: 8123
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            memory: 64Mi
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argo-cd-webhook
  namespace: argo-system
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: external
    namespace: network
    sectionName: https
  hostnames:
  - argo.rbl.lol
  rules:
  - backendRefs:
    - group: ''
      kind: Service
      name: argo-cd-argocd-server
      port: 80
      weight: 1
    # Only the GitHub push webhook is public; the UI is on the internal Gateway.
    matches:
    - path:
        type: PathPrefix
        value: /api/webhook
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo
  namespace: default
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: external
    namespace: network
    sectionName: https
  hostnames:
  - demo.rbl.lol
  rules:
  - backendRefs:
    - group: ''
      kind: Service
      name: demo
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo
  namespace: default
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: external
    namespace: network
    sectionName: https
  hostnames:
  - echo.rbl.lol
  rules:
  - backendRefs:
    - group: ''
      kind: Service
      name: echo
      port: 8080
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
  namespace: forgejo
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: external
    namespace: network
    sectionName: https
  hostnames:
  - forgejo.rbl.lol
  rules:
  - backendRefs:
    - group: ''
      kind: Service
      name: forgejo-http
      port: 3000
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  namespace: home-system
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: external
    namespace: network
    sectionName: https
  hostnames:
  - hass.rbl.lol
  rules:
  - backendRefs:
    - group: ''
      kind: Service
      name: home-assistant-gateway
      port: 8123
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: plex
  namespace: media
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: external
    namespace: network
    sectionName: https
  hostnames:
  - plex.rbl.lol
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        path:
          type: ReplaceFullPath
          replaceFullPath: /web
        statusCode: 302
    matches:
    - path:
        type: Exact
        value: /
  - backendRefs:
    - group: ''
      kind: Service
      name: plex
      port: 32400
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: plausible
  namespace: observability
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: external
    namespace: network
    sectionName: https
  hostnames:
  - plausible.rbl.lol
  rules:
  - backendRefs:
    - group: ''
      kind: Service
      name: plausible-plausible-analytics
