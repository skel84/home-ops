---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-builder
---
# The record task annotates its own PipelineRun with the commit SHA and image digest.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: demo-builder
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-builder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: demo-builder
subjects:
  - kind: ServiceAccount
    name: demo-builder
