controllers:
  homepage:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: ghcr.io/gethomepage/homepage
          tag: v2.8.0
        # A list keeps MY_POD_IP defined before it is referenced.
        env:
          - name: MY_POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          # The pod IP entry lets the kubelet probes through the host check.
          - name: HOMEPAGE_ALLOWED_HOSTS
            value: $(MY_POD_IP):3000,home.rbl.lol
        # API keys, referenced in the config as {{HOMEPAGE_VAR_*}}.
        envFrom:
          - secretRef:
              name: homepage-secret
          - secretRef:
              name: homepage-external
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/healthcheck
                port: &port 3000
              periodSeconds: 15
          readiness: *probes
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL

defaultPodOptions:
  # app-template v5 leaves the token out; Homepage needs it to read the cluster.
  automountServiceAccountToken: true
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

service:
  app:
    controller: homepage
    ports:
      http:
        port: *port

route:
  app:
    hostnames:
      - home.rbl.lol
    parentRefs:
      - name: internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: *port
        matches:
          - path:
              type: PathPrefix
              value: /

# Read-only cluster access for pod stats, node/cluster usage and route discovery.
rbac:
  roles:
    homepage:
      type: ClusterRole
      rules:
        - apiGroups: [""]
          resources: [namespaces, pods, nodes]
          verbs: [get, list]
        - apiGroups: [networking.k8s.io]
          resources: [ingresses]
          verbs: [get, list]
        - apiGroups: [gateway.networking.k8s.io]
          resources: [httproutes, gateways]
          verbs: [get, list]
        - apiGroups: [metrics.k8s.io]
          resources: [nodes, pods]
          verbs: [get, list]
  bindings:
    homepage:
      type: ClusterRoleBinding
      roleRef:
        identifier: homepage
      subjects:
        - identifier: homepage

persistence:
  # Homepage writes skeleton files and logs next to its config, so the
  # directory is writable and only our files come from the ConfigMap.
  data:
    type: emptyDir
    globalMounts:
      - path: /app/config
  config:
    type: configMap
    identifier: config
    globalMounts:
      - path: /app/config/settings.yaml
        subPath: settings.yaml
      - path: /app/config/services.yaml
        subPath: services.yaml
      - path: /app/config/widgets.yaml
        subPath: widgets.yaml
      - path: /app/config/kubernetes.yaml
        subPath: kubernetes.yaml
      - path: /app/config/bookmarks.yaml
        subPath: bookmarks.yaml

configMaps:
  config:
    data:
      kubernetes.yaml: |
        mode: cluster
        # Routes annotated with gethomepage.dev/enabled appear automatically.
        ingress: true
        gateway: true

      settings.yaml: |
        title: Home
        theme: dark
        color: slate
        headerStyle: clean
        statusStyle: dot
        hideVersion: true
        useEqualHeights: true
        providers:
          longhorn:
            url: http://longhorn-frontend.longhorn-system.svc
        layout:
          Home:
            style: row
            columns: 3
          Media:
            style: row
            columns: 4
          Downloads:
            style: row
            columns: 4
          Infrastructure:
            style: row
            columns: 4
          Observability:
            style: row
            columns: 4
          Apps:
            style: row
            columns: 4

      bookmarks.yaml: |
        []

      widgets.yaml: |
        - kubernetes:
            cluster:
              show: true
              cpu: true
              memory: true
              showLabel: true
              label: cluster
            nodes:
              show: true
              cpu: true
              memory: true
              showLabel: true
        - longhorn:
            expanded: true
            total: true
            labels: true
            nodes: true
        - openmeteo:
            label: Home
            latitude: "{{HOMEPAGE_VAR_LATITUDE}}"
            longitude: "{{HOMEPAGE_VAR_LONGITUDE}}"
            timezone: Europe/Rome
            units: metric
            cache: 15
        - datetime:
            text_size: md
            locale: it
            format:
              dateStyle: long
              timeStyle: short
        - search:
            provider: duckduckgo
            target: _blank

      services.yaml: |
        - Home:
            - Home Assistant:
                icon: home-assistant.svg
                href: https://hass.rbl.lol
                namespace: home-system
                app: home-assistant
                widget:
                  type: homeassistant
                  url: http://home-assistant.home-system.svc:8123
                  key: "{{HOMEPAGE_VAR_HASS_KEY}}"
            - Frigate:
                icon: frigate.svg
                href: https://frigate.rbl.lol
                namespace: home-system
                app: frigate
                widget:
                  type: frigate
                  url: http://frigate-web.home-system.svc:5000
                  enableRecentEvents: true
            - Scrypted:
                icon: scrypted.png
                href: https://scrypted.rbl.lol:10443
                namespace: home-system
                app: scrypted
            - Music Assistant:
                icon: music-assistant.svg
                href: http://192.168.0.51:8095
                namespace: home-system
                app: music-assistant
            - Mosquitto:
                icon: mosquitto.svg
                description: MQTT broker
                namespace: home-system
                app: mosquitto
            - CUPS:
                icon: cups.svg
                description: AirPrint for the Canon MG6100
                namespace: home-system
                app: cups

        - Media:
            - Plex:
                icon: plex.svg
                href: https://plex.rbl.lol
                namespace: media
                app: plex
                widget:
                  type: plex
                  url: http://plex.media.svc:32400
                  key: "{{HOMEPAGE_VAR_PLEX_KEY}}"
            - Overseerr:
                icon: overseerr.svg
                href: https://overseer.rbl.lol
                namespace: downloads
                app: overseer
                widget:
                  type: seerr
