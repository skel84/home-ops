---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Reuses the UniFi and Grafana items that unpoller and Grafana already read.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-external
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: homepage-external
    template:
      data:
        HOMEPAGE_VAR_UNIFI_KEY: "{{ .UNIFI_API_KEY }}"
        HOMEPAGE_VAR_GRAFANA_USER: "{{ .GRAFANA_ADMIN_USERNAME }}"
        HOMEPAGE_VAR_GRAFANA_PASS: "{{ .GRAFANA_ADMIN_PASSWORD }}"
  dataFrom:
    - extract:
        key: unifi
    - extract:
        key: grafana
