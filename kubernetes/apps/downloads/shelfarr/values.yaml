controllers:
  shelfarr:
    annotations:
      reloader.stakater.com/auto: "true"

    pod:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"

    containers:
      app:
        image:
          repository: ghcr.io/pedro-revez-silva/shelfarr
          tag: latest@sha256:49c1968b07d0f2b476611221073bc692034028fd5951060ddb1bcf2bdbb495d6
          pullPolicy: IfNotPresent
        env:
          CHOWN_ON_START: auto
          HTTP_PORT: &port 80
          PGID: 1000
          PUID: 1000
          SOLID_QUEUE_IN_PUMA: "1"
          TZ: "Europe/Rome"
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /up
                port: *port
              initialDelaySeconds: 40
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 3
          readiness: *probes
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL

service:
  app:
    controller: shelfarr
    ports:
      http:
        port: *port

persistence:
  storage:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: asustor-iscsi
    forceRename: shelfarr-iscsi
    globalMounts:
      - path: /rails/storage
  tmp:
    type: emptyDir
    globalMounts:
      - path: /rails/tmp
  audiobooks:
    type: nfs
    server: 192.168.0.217
    path: /volume1/Media/Audiobooks
    globalMounts:
      - path: /audiobooks
  ebooks:
    type: nfs
    server: 192.168.0.217
    path: /volume1/Media/Books
    globalMounts:
      - path: /ebooks
  downloads:
    type: nfs
    server: 192.168.0.217
    path: /volume1/Download
    globalMounts:
      - path: /downloads

route:
  app:
    hostnames:
      - "{{ .Release.Name }}.rbl.lol"
    parentRefs:
      - name: internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: *port
        matches:
          - path:
              type: PathPrefix
              value: /
