controllers:
  overseerr:
    enabled: true
    type: deployment
    annotations: {}
    labels: {}
    replicas: 1
    containers:
      app:
        image:
          repository: ghcr.io/hotio/overseerr
          tag: release-1.34.0@sha256:f6dda8b893dbd91003c6f486c77b3b07e2ce7a99f0f4838c884285c9c8002136
          pullPolicy: IfNotPresent
        env:
          TZ: Europe/Rome
          PUID: 1000
          PGID: 1000
          UMASK: 002
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 100m
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 5
service:
  app:
    controller: overseerr
    ports:
      http:
        port: 5055
route:
  app:
    hostnames:
      - "{{ .Release.Name }}.rbl.lol"
    parentRefs:
      - name: internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: 5055
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    storageClass: asustor-iscsi
    forceRename: overseer-config-iscsi
    accessMode: ReadWriteOnce
    size: 1Gi
    retain: false
    globalMounts:
      - path: /config
        readOnly: false
