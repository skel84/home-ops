---
apiVersion: v1
kind: Service
metadata:
  name: aiometadata-redis
  namespace: nuvio
  labels:
    app.kubernetes.io/name: aiometadata-redis
    app.kubernetes.io/part-of: nuvio
spec:
  selector:
    app.kubernetes.io/name: aiometadata-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiometadata-redis
  namespace: nuvio
  labels:
    app.kubernetes.io/name: aiometadata-redis
    app.kubernetes.io/part-of: nuvio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aiometadata-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiometadata-redis
        app.kubernetes.io/part-of: nuvio
    spec:
      containers:
        - name: redis
          image: redis:8.8.4-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --save
            - "3600"
            - "1"
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: true
          volumeMounts:
            - name: cache
              mountPath: /data
      volumes:
        - name: cache
          emptyDir: {}
