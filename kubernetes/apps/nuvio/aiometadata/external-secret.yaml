---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aiometadata-secrets
  namespace: nuvio
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: aiometadata-secrets
    creationPolicy: Owner
  data:
    - secretKey: BUILT_IN_TMDB_API_KEY
      remoteRef:
        key: AIOMetadata
        property: TMDB_API_KEY
    - secretKey: ADMIN_KEY
      remoteRef:
        key: AIOMetadata
        property: ADMIN_KEY
