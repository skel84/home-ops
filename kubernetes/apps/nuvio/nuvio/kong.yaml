---
apiVersion: v1
kind: Service
metadata:
  name: kong
  namespace: nuvio
  labels:
    app.kubernetes.io/name: nuvio-kong
    app.kubernetes.io/part-of: nuvio
spec:
  selector:
    app.kubernetes.io/name: nuvio-kong
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  namespace: nuvio
  labels:
    app.kubernetes.io/name: nuvio-kong
    app.kubernetes.io/part-of: nuvio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nuvio-kong
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nuvio-kong
        app.kubernetes.io/part-of: nuvio
    spec:
      containers:
        - name: kong
          image: kong/kong:3.9.1@sha256:6addf50e6bd8d578314cb9ce4f2d2d1e3781d2edecef59f707e00c6e05d384f5
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /home/kong/kong-entrypoint.sh
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /usr/local/kong/kong.yml
            - name: KONG_DNS_ORDER
              value: LAST,A,CNAME
            - name: KONG_DNS_NOT_FOUND_TTL
              value: "1"
            - name: KONG_PLUGINS
              value: request-transformer,cors,key-auth,acl,basic-auth,request-termination,post-function
            - name: KONG_NGINX_PROXY_PROXY_BUFFER_SIZE
              value: 160k
            - name: KONG_NGINX_PROXY_PROXY_BUFFERS
              value: 64 160k
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout combined
            - name: NUVIO_GATEWAY_CONFIG_VERSION
              value: discovery-v1
            - name: SUPABASE_PUBLIC_URL
              value: https://nuvio.rbl.lol
            - name: ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: nuvio-secrets
                  key: ANON_KEY
            - name: SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: nuvio-secrets
                  key: ANON_KEY
            - name: SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: nuvio-secrets
                  key: SERVICE_ROLE_KEY
            - name: SUPABASE_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: nuvio-secrets
                  key: SERVICE_ROLE_KEY
            - name: SUPABASE_PUBLISHABLE_KEY
              value: ""
            - name: SUPABASE_SECRET_KEY
              value: ""
            - name: ANON_KEY_ASYMMETRIC
              value: ""
            - name: SERVICE_ROLE_KEY_ASYMMETRIC
              value: ""
            - name: DASHBOARD_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nuvio-secrets
                  key: DASHBOARD_USERNAME
            - name: DASHBOARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nuvio-secrets
                  key: DASHBOARD_PASSWORD
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: kong-config
              mountPath: /home/kong/temp.yml
              subPath: temp.yml
            - name: kong-config
              mountPath: /home/kong/kong-entrypoint.sh
              subPath: kong-entrypoint.sh
      volumes:
        - name: kong-config
          configMap:
            name: nuvio-kong
            items:
              - key: kong.yml
                path: temp.yml
              - key: kong-entrypoint.sh
                path: kong-entrypoint.sh
