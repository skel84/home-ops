---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nuvio-backups
  namespace: nuvio
  labels:
    app.kubernetes.io/name: nuvio-backup
    app.kubernetes.io/part-of: nuvio
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
