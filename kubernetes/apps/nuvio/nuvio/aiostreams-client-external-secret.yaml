---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aiostreams-client
  namespace: nuvio
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: aiostreams-client
    creationPolicy: Owner
  data:
    - secretKey: MANIFEST_URL
      remoteRef:
        key: AIOStreams client
        property: MANIFEST_URL
    - secretKey: CONFIG_PASSWORD
      remoteRef:
        key: AIOStreams client
        property: CONFIG_PASSWORD
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: AIOStreams client
        property: ADMIN_PASSWORD
    - secretKey: CONFIG_UUID
      remoteRef:
        key: AIOStreams client
        property: CONFIG_UUID
