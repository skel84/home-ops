---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nuvio-secrets
  namespace: nuvio
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: nuvio-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: Nuvio self-host
        property: POSTGRES_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: Nuvio self-host
        property: JWT_SECRET
    - secretKey: ANON_KEY
      remoteRef:
        key: Nuvio self-host
        property: ANON_KEY
    - secretKey: SERVICE_ROLE_KEY
      remoteRef:
        key: Nuvio self-host
        property: SERVICE_ROLE_KEY
    - secretKey: DASHBOARD_USERNAME
      remoteRef:
        key: Nuvio self-host
        property: DASHBOARD_USERNAME
    - secretKey: DASHBOARD_PASSWORD
      remoteRef:
        key: Nuvio self-host
        property: DASHBOARD_PASSWORD
    - secretKey: SECRET_KEY_BASE
      remoteRef:
        key: Nuvio self-host
        property: SECRET_KEY_BASE
    - secretKey: VAULT_ENC_KEY
      remoteRef:
        key: Nuvio self-host
        property: VAULT_ENC_KEY
    - secretKey: PG_META_CRYPTO_KEY
      remoteRef:
        key: Nuvio self-host
        property: PG_META_CRYPTO_KEY
    - secretKey: S3_PROTOCOL_ACCESS_KEY_ID
      remoteRef:
        key: Nuvio self-host
        property: S3_PROTOCOL_ACCESS_KEY_ID
    - secretKey: S3_PROTOCOL_ACCESS_KEY_SECRET
      remoteRef:
        key: Nuvio self-host
        property: S3_PROTOCOL_ACCESS_KEY_SECRET
    - secretKey: POOLER_TENANT_ID
      remoteRef:
        key: Nuvio self-host
        property: POOLER_TENANT_ID
