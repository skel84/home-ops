---
apiVersion: v1
kind: Service
metadata:
  name: imgproxy
  namespace: nuvio
  labels:
    app.kubernetes.io/name: nuvio-imgproxy
    app.kubernetes.io/part-of: nuvio
spec:
  selector:
    app.kubernetes.io/name: nuvio-imgproxy
  ports:
    - name: http
      port: 5001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: imgproxy
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  namespace: nuvio
  labels:
    app.kubernetes.io/name: nuvio-imgproxy
    app.kubernetes.io/part-of: nuvio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nuvio-imgproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nuvio-imgproxy
        app.kubernetes.io/part-of: nuvio
    spec:
      containers:
        - name: imgproxy
          image: darthsim/imgproxy:v3.30.1@sha256:3b709e4a0e5e8e0e959b556b7031229202b4b8e7e7d955c517ea7abed68ee34d
          imagePullPolicy: IfNotPresent
          env:
            - name: IMGPROXY_BIND
              value: :5001
            - name: IMGPROXY_LOCAL_FILESYSTEM_ROOT
              value: /
            - name: IMGPROXY_USE_ETAG
              value: "true"
            - name: IMGPROXY_AUTO_WEBP
              value: "true"
            - name: IMGPROXY_MAX_SRC_RESOLUTION
              value: "16.8"
          ports:
            - name: http
              containerPort: 5001
          readinessProbe:
            exec:
              command:
                - imgproxy
                - health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - imgproxy
                - health
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: storage-data
              mountPath: /var/lib/storage
              readOnly: true
      volumes:
        - name: storage-data
          persistentVolumeClaim:
            claimName: storage-data
