---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nuvio
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  namespace: nuvio
  labels:
    app.kubernetes.io/name: nuvio
    app.kubernetes.io/part-of: nuvio
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
      namespace: network
      sectionName: https
  hostnames:
    - nuvio.rbl.lol
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/nuvio
        - path:
            type: PathPrefix
            value: /.well-known/oauth-authorization-server
        - path:
            type: PathPrefix
            value: /auth/v1
        - path:
            type: PathPrefix
            value: /rest/v1
        - path:
            type: PathPrefix
            value: /graphql/v1
        - path:
            type: PathPrefix
            value: /realtime/v1
        - path:
            type: PathPrefix
            value: /storage/v1
        - path:
            type: PathPrefix
            value: /functions/v1
        - path:
            type: PathPrefix
            value: /sso/saml
        - path:
            type: PathPrefix
            value: /api/mcp
      backendRefs:
        - group: ""
          kind: Service
          name: kong
          port: 8000
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: account-dashboard
          port: 8080
          weight: 1
