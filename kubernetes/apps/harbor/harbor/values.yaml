expose:
  # The chart renders its own HTTPRoute on the external Gateway.
  type: route
  tls:
    enabled: true
    certSource: none
  route:
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: external
        namespace: network
        sectionName: https
    hosts:
      - harbor.rbl.lol

externalURL: https://harbor.rbl.lol

existingSecretAdminPassword: harbor-admin-secret
existingSecretSecretKey: harbor-secret-key

registry:
  credentials:
    existingSecret: harbor-registry-credentials

persistence:
  enabled: true
  resourcePolicy: keep
  persistentVolumeClaim:
    registry:
      existingClaim: harbor-registry
    database:
      storageClass: longhorn
      size: 10Gi
    redis:
      storageClass: longhorn
      size: 2Gi
    trivy:
      storageClass: longhorn
      size: 10Gi
  imageChartStorage:
    type: filesystem
    filesystem:
      rootdirectory: /storage

jobservice:
  jobLoggers:
    - database

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
