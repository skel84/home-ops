controllers:
  home-assistant:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: ghcr.io/home-assistant/home-assistant
          tag: 2026.11
        # The image sets UV_SYSTEM_PYTHON, which makes HA install integration
        # requirements into /usr/local (not writable as uid 1000). Unset it
        # so HA uses the user site below; env execs /init, which stays PID 1.
        command: ["env", "-u", "UV_SYSTEM_PYTHON", "/init"]
        env:
          TZ: Europe/Rome
          HASS_HTTP_TRUSTED_PROXY_1: 192.168.0.0/24
          HASS_HTTP_TRUSTED_PROXY_2: 10.42.0.0/16
          PYTHONPATH: "/config/deps"
          # User site for integration requirements, on the config-cache PVC.
          PYTHONUSERBASE: /config/.venv
          UV_NO_CACHE: "true"
          VENV_FOLDER: /venv

        # envFrom:
        #   - secretRef:
        #       name: home-assistant-secret
        # securityContext:
        #   allowPrivilegeEscalation: false
        #   readOnlyRootFilesystem: true
        #   capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 10m
          limits:
            memory: 2Gi
      code-server:
        image:
          repository: ghcr.io/coder/code-server
          tag: 4.145.2@sha256:09565f9e07f5624554e295e8bab0e2fec4a7c533eb3cff459ed6596a4d3d7c1c
        args:
          [
            "--auth",
            "none",
            "--user-data-dir",
            "/config/.vscode",
            "--extensions-dir",
            "/config/.vscode",
            "--port",
            "12321",
            "/config",
          ]
        env:
          HASS_SERVER: http://localhost:8123
          TZ: Europe/Rome
        resources:
          requests:
            cpu: 10m
          limits:
            memory: 512Mi

defaultPodOptions:
  automountServiceAccountToken: true
  hostNetwork: true
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

service:
  app:
    controller: home-assistant
    primary: true
    forceRename: home-assistant
    type: LoadBalancer
    externalTrafficPolicy: Cluster
    loadBalancerIP: 192.168.0.54
    annotations:
      external-dns.alpha.kubernetes.io/hostname: home-assistant.rbl.lol
    ports:
      http:
        port: 8123
      code-server:
        port: 12321

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 2Gi
    storageClass: longhorn
    globalMounts:
      - path: /config
  config-cache:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 2Gi
    storageClass: longhorn
    globalMounts:
      - path: /config/.venv
  config-logs:
    type: emptyDir
    globalMounts:
      - path: /config/logs
  config-tts:
    type: emptyDir
    globalMounts:
      - path: /config/tts
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
