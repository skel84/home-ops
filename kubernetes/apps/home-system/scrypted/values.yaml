controllers:
  scrypted:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: ghcr.io/bjw-s-labs/scrypted
          tag: 0.141.0@sha256:c9e82faec2e27debeba03fd8d4bdb2aa53cdaf0f3f8aa77c04312a047db4c2ea
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        resources:
          requests:
            cpu: 136m
            memory: 1024Mi
            gpu.intel.com/i915: 1
          limits:
            gpu.intel.com/i915: 1
            memory: 8192Mi

service:
  app:
    type: LoadBalancer
    controller: scrypted
    primary: true
    loadBalancerIP: 192.168.0.55
    ports:
      http:
        port: 11080
        primary: true
      rebroadcast1:
        port: 37861
      rebroadcast2:
        port: 37862
      bridgeport: # homekit
        port: 35492
    externalTrafficPolicy: Local
    annotations:
      external-dns.alpha.kubernetes.io/hostname: scrypted.rbl.lol

defaultPodOptions:
  automountServiceAccountToken: true
  hostNetwork: true

