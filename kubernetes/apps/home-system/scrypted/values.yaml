persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    forceRename: scrypted-config
    accessMode: ReadWriteOnce
    size: 2Gi
    storageClass: longhorn
    advancedMounts:
      scrypted:
        app:
          - path: /server/volume
  cache:
    type: emptyDir
    globalMounts:
      - path: /.cache
  cache-npm:
    type: emptyDir
    globalMounts:
      - path: /.npm
  recs:
    type: nfs
    server: 192.168.0.217
    path: /volume1/Recordings
    advancedMounts:
      scrypted:
        app:
          - path: /recs
# Keep app-template v4 ServiceAccount behaviour (namespace default SA, token mounted)
global:
  createDefaultServiceAccount: false
