controllers:
  music-assistant:
    containers:
      app:
        image:
          repository: ghcr.io/music-assistant/server
          tag: 2.10.13
        env:
          TZ: Europe/Rome
        resources:
          requests:
            cpu: 10m
          limits:
            memory: 2Gi

defaultPodOptions:
  # AirPlay and Cast discovery use mDNS, and players fetch audio from the
  # host on port 8097, so the pod needs the LAN, like Home Assistant.
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  # AirPlay 2 multi-room sync uses PTP on UDP 319/320, which needs root; as
  # uid 1000 MA logs "Cannot bind UDP 319" and falls back to NTP timing.
  # Upstream's image and the HA add-on run as root as well.
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

service:
  app:
    controller: music-assistant
    type: LoadBalancer
    externalTrafficPolicy: Cluster
    loadBalancerIP: 192.168.0.51
    annotations:
      external-dns.alpha.kubernetes.io/hostname: music-assistant.rbl.lol
    ports:
      http:
        port: 8095

persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: longhorn
    globalMounts:
      - path: /data
  # DroppedNeedle's library on the NAS, for MA's local filesystem provider.
  music:
    type: nfs
    server: 192.168.0.217
    path: /volume1/Media/Music
    globalMounts:
      - path: /media/music
        readOnly: true

global:
  createDefaultServiceAccount: false
