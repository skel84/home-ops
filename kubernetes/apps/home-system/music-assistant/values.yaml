controllers:
  music-assistant:
    containers:
      app:
        image:
          repository: ghcr.io/music-assistant/server
          tag: 2.10.9
        env:
          TZ: Europe/Rome
        resources:
          requests:
            cpu: 10m
          limits:
            memory: 2Gi

defaultPodOptions:
  # AirPlay and Cast discovery use mDNS, and players fetch audio from the
  # host on port 8097, so the pod needs the LAN, like Home Assistant.
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

service:
  app:
    controller: music-assistant
    type: LoadBalancer
    externalTrafficPolicy: Cluster
    loadBalancerIP: 192.168.0.51
    annotations:
      external-dns.alpha.kubernetes.io/hostname: music-assistant.rbl.lol
    ports:
      http:
        port: 8095

persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: longhorn
    globalMounts:
      - path: /data

global:
  createDefaultServiceAccount: false
