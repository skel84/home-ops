---
# Seed config: copied to /config/config.yml on first start only, so zones,
# masks and GenAI settings edited in the Frigate UI survive restarts.
# Delete /config/config.yml on the PVC to re-seed from this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frigate-configmap
  namespace: home-system
data:
  config.yml: |
    version: 0.18-0

    mqtt:
      host: mosquitto.home-system.svc.cluster.local

    go2rtc:
      streams:
        terrazzo_ovest:
          - "ffmpeg:http://192.168.0.92/flv?port=1935&app=bcs&stream=channel0_main.bcs&user=admin&password={FRIGATE_RTSP_PASSWORD}#video=copy#audio=copy#audio=opus"
        terrazzo_ovest_sub:
          - "ffmpeg:http://192.168.0.92/flv?port=1935&app=bcs&stream=channel0_ext.bcs&user=admin&password={FRIGATE_RTSP_PASSWORD}"
        balcone_est:
          - "ffmpeg:http://192.168.0.141/flv?port=1935&app=bcs&stream=channel0_main.bcs&user=admin&password={FRIGATE_RTSP_PASSWORD}#video=copy#audio=copy#audio=opus"
        balcone_est_sub:
          - "ffmpeg:http://192.168.0.141/flv?port=1935&app=bcs&stream=channel0_ext.bcs&user=admin&password={FRIGATE_RTSP_PASSWORD}"

    cameras:
      terrazzo_ovest:
        ffmpeg:
          inputs:
            - path: rtsp://127.0.0.1:8554/terrazzo_ovest
              input_args: preset-rtsp-restream
              roles: [record]
            - path: rtsp://127.0.0.1:8554/terrazzo_ovest_sub
              input_args: preset-rtsp-restream
              roles: [detect]
      balcone_est:
        ffmpeg:
          inputs:
            - path: rtsp://127.0.0.1:8554/balcone_est
              input_args: preset-rtsp-restream
              roles: [record]
            - path: rtsp://127.0.0.1:8554/balcone_est_sub
              input_args: preset-rtsp-restream
              roles: [detect]

    # Frigate 0.18 leaves detection off unless it is enabled explicitly.
    detect:
      enabled: true

    ffmpeg:
      hwaccel_args: preset-vaapi

    detectors:
      ov:
        type: openvino
        device: GPU

    model:
      width: 300
      height: 300
      input_tensor: nhwc
      input_pixel_format: bgr
      path: /openvino-model/ssdlite_mobilenet_v2.xml
      labelmap_path: /openvino-model/coco_91cl_bkgr.txt

    objects:
      track: [bird, person, cat, dog]
      filters:
        bird:
          # Small, distant birds score low; raise if leaves and shadows trigger it.
          min_score: 0.4
          threshold: 0.6

    review:
      alerts:
        labels: [bird, person]

    record:
      enabled: true
      continuous:
        days: 0
      alerts:
        pre_capture: 5
        post_capture: 10
        retain:
          days: 30
          mode: all
      detections:
        pre_capture: 5
        post_capture: 10
        retain:
          days: 14
          mode: motion

    snapshots:
      enabled: true
      retain:
        default: 30

    classification:
      bird:
        enabled: true
