controllers:
  calibre-web:
    annotations:
      reloader.stakater.com/auto: "true"

    containers:
      app:
        image:
          repository: lscr.io/linuxserver/calibre-web
          tag: latest@sha256:8eabbc9ac4d7fcbc252434493078ba22e4e8c3aa461e11b102020b040c5fc3e6
          pullPolicy: IfNotPresent
        env:
          PUID: 999
          PGID: 999
          TZ: "Europe/Rome"
          UMASK: "002"
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: &port 8083
              initialDelaySeconds: 30
              periodSeconds: 10
              timeoutSeconds: 2
              failureThreshold: 6
          readiness: *probes
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi

service:
  app:
    controller: calibre-web
    ports:
      http:
        port: *port

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 2Gi
    storageClass: asustor-iscsi
    forceRename: calibre-web-iscsi
    globalMounts:
      - path: /config
  tmp:
    type: emptyDir
  books:
    type: nfs
    server: 192.168.0.217
    path: /volume1/Media/Books
    globalMounts:
      - path: /books

route:
  app:
    hostnames:
      - "{{ .Release.Name }}.rbl.lol"
    parentRefs:
      - name: internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: *port
        matches:
          - path:
              type: PathPrefix
              value: /
# Keep app-template v4 ServiceAccount behaviour (namespace default SA, token mounted)
global:
  createDefaultServiceAccount: false
defaultPodOptions:
  automountServiceAccountToken: true
