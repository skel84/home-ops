---
controllers:
  aiostreams:
    annotations:
      reloader.stakater.com/auto: "true"

    pod:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        supplementalGroups:
          - 65542 # gladius:external-services

    containers:
      app:
        image:
          repository: ghcr.io/viren070/aiostreams
          tag: v2.38.1@sha256:1b90bc2fda70f365dff2ce98fc311a24708cca9841efe09aefe309cd4da1fb2c
          pullPolicy: IfNotPresent
        env:
          TZ: Europe/Rome
          BASE_URL: https://aiostreams.rbl.lol
          PORT: &port 3000
          DATABASE_URI: sqlite://./data/db.sqlite
          DISK_CACHE_DIR: /app/data/cache
          LOG_FORMAT: json
          ALLOW_PRIVATE_URLS: "true"
          AIOSTREAMS_AUTH_REQUIRED: "true"
          SYSTEM_LIFECYCLE_ENABLED: "false"
          # SECRET_KEY, AIOSTREAMS_AUTH and FORCED_SERVICE_CREDENTIALS come
          # from values.sops.yaml.
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/v1/status
                port: *port
              initialDelaySeconds: 30
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 6
          readiness: *probes
          startup:
            enabled: true
            spec:
              httpGet:
                path: /api/v1/status
                port: *port
              failureThreshold: 30
              periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL

service:
  app:
    controller: aiostreams
    ports:
      http:
        port: *port

persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClass: longhorn
    globalMounts:
      - path: /app/data

route:
  app:
    hostnames:
      - aiostreams.rbl.lol
    parentRefs:
      - name: external
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: *port
        matches:
          - path:
              type: PathPrefix
              value: /

# Keep app-template v4 ServiceAccount behaviour (namespace default SA, token mounted)
global:
  createDefaultServiceAccount: false
defaultPodOptions:
  automountServiceAccountToken: true
